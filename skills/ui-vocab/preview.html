line dot marks the rhythm","ko":"카드 네 장이 한 박자씩 늦게 차례로 들어오고, 타임라인 점이 리듬을 표시함"},"chips":{"en":["step 60ms","duration 300ms","cap 8"],"ko":["간격 60ms","시간 300ms","최대 개수 8"]}},"smooth-transition":{"en":"Smooth Transition","ko":"스무스 트랜지션","when":{"en":"A state change (open, filter, theme) would otherwise jump.","ko":"열기·필터·테마 같은 상태 변화가 툭 바뀌지 않게"},"caption":{"en":"A click toggles a view; the old panel eases out while the new one eases in, no jump","ko":"클릭으로 뷰가 바뀔 때 이전 패널은 부드럽게 사라지고 새 패널이 들어옴"},"chips":{"en":["duration 200ms","easing ease-out"],"ko":["시간 200ms","이징 ease-out"]}},"glassmorphism":{"en":"Glassmorphism","ko":"글래스모피즘","when":{"en":"A floating panel over colorful content should feel layered.","ko":"화려한 배경 위에 떠 있는 패널이 겹쳐 보여야 할 때"},"caption":{"en":"A translucent frosted panel slides over colorful shapes, blurring what lies beneath it","ko":"반투명한 유리 패널이 색색의 도형 위로 들어와 아래를 흐리게 비춤"},"chips":{"en":["blur 12px","opacity 70%","border on"],"ko":["블러 12px","불투명도 70%","테두리 on"]}},"parallax":{"en":"Parallax","ko":"패럴랙스","when":{"en":"A hero or story section wants depth from 2-3 layers.","ko":"2~3개 레이어로 깊이감을 주려는 히어로나 스토리 섹션"},"caption":{"en":"Scrolling moves the front card far and the hills behind it a little, giving depth","ko":"스크롤 시 앞 카드는 많이, 뒤 언덕은 조금 움직여 깊이감이 생김"},"chips":{"en":["speed 0.4","layers 2","mobile still"],"ko":["속도 0.4","레이어 2","모바일 still"]}},"scroll-snap":{"en":"Scroll Snap","ko":"스크롤 스냅","when":{"en":"A page or gallery where each item aligns after scrolling.","ko":"스크롤 뒤 항목이 정확히 맞춰 멈춰야 하는 페이지나 갤러리"},"caption":{"en":"A scroll stops mid-way, then the nearest section snaps into alignment with the frame","ko":"스크롤이 중간에 멈추면 가장 가까운 섹션이 프레임에 딱 맞춰 정렬됨"},"chips":{"en":["axis y","align start","strictness proximity"],"ko":["축 y","정렬 start","엄격도 proximity"]}},"micro-interaction":{"en":"Micro-interaction","ko":"마이크로 인터랙션","when":{"en":"A small action (like, toggle, copy) needs instant feedback.","ko":"좋아요·토글·복사 같은 작은 동작에 즉각 피드백이 필요할 때"},"caption":{"en":"A tap on a heart button; it pops larger and fills with color, then settles","ko":"하트 버튼을 누르면 커지며 색이 채워지고 다시 제자리로"},"chips":{"en":["duration 150ms","feedback scale"],"ko":["시간 150ms","피드백 scale"]}}};
const S = {
  en: { q: 'Question {i} of {n}', pick: 'Pick a pattern for this area', rec: 'recommended', hint: 'Type the number in Claude Code. <b>/ui-picker</b> opens this in the terminal.', none: 'No question in the address. Example: preview.html#q=card-layout,bento-grid&lang=en' },
  ko: { q: '질문 {i}/{n}', pick: '이 영역의 패턴을 고르세요', rec: '추천', hint: 'Claude Code에 번호를 입력하세요. <b>/ui-picker</b>를 치면 터미널 패널에서도 열립니다.', none: '주소에 질문이 없습니다. 예: preview.html#q=card-layout,bento-grid&lang=ko' },
};
const params = new URLSearchParams(location.hash.slice(1));
const lang = params.get('lang') === 'ko' ? 'ko' : 'en';
const labels = (() => { try { return JSON.parse(params.get('labels') || '{}') } catch { return {} } })();
const str = (k) => (labels.ui && labels.ui[k]) || S[lang][k];
const tx = (id, f) => (labels.terms && labels.terms[id] && labels.terms[id][f]) || (f === 'name' ? TERMS[id][lang] : TERMS[id][f][lang]);
const title = params.get('title') || 'ui-picker';
document.getElementById('title').textContent = title;
document.title = title + ' · ui-picker';
document.getElementById('hint').innerHTML = str('hint');
const qs = (params.get('q') || '').split(';').map(s => s.split(',').map(x => x.trim()).filter(x => INDEX[x])).filter(a => a.length);
const root = document.getElementById('qs');
if (!qs.length) document.getElementById('sub').textContent = S[lang].none;
const imgs = [];
qs.forEach((ids, qi) => {
  const sec = document.createElement('section');
  sec.innerHTML = '<h2>' + str('q').replace('{i}', qi + 1).replace('{n}', qs.length) + ' · ' + str('pick') + '</h2><div class="row"></div>';
  const row = sec.querySelector('.row');
  ids.forEach((id, i) => {
    const fig = document.createElement('figure');
    const img = document.createElement('img'); img.alt = tx(id, 'name'); imgs.push({ img, id });
    fig.appendChild(img);
    const cap = document.createElement('figcaption');
    cap.innerHTML = '<span class="key">' + (i + 1) + '</span><span class="name"></span>' + (i === 0 ? '<span class="rec">· ' + str('rec') + '</span>' : '') +
      '<p class="cap"></p><p class="when"></p><p class="chips"></p>';
    cap.querySelector('.name').textContent = tx(id, 'name');
    cap.querySelector('.cap').textContent = tx(id, 'caption');
    cap.querySelector('.when').textContent = tx(id, 'when');
    cap.querySelector('.chips').textContent = TERMS[id].chips[lang].join(' · ');
    fig.appendChild(cap); row.appendChild(fig);
  });
  root.appendChild(sec);
});
let slot = 0;
const draw = () => { for (const { img, id } of imgs) img.src = 'data:image/png;base64,' + FRAMES[INDEX[id][slot]]; slot = (slot + 1) % SLOTS; };
draw(); setInterval(draw, 100);
addEventListener('hashchange', () => location.reload());
</script></body></html>
